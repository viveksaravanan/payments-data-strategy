[project]
name = "payments-data-strategy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "faker>=30",
    "folium>=0.16",
    "matplotlib>=3.8",
    "numpy>=2",
    "pandas>=2",
    "plotly>=5",
    "python-dotenv>=1",
    "streamlit>=1.39",
    "streamlit-folium>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not llm'"
markers = [
    "llm: tests that hit the Anthropic API (opt-in via `-m llm`); requires ANTHROPIC_API_KEY",
]
