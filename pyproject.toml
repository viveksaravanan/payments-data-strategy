[project]
name = "payments-data-strategy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "faker>=30",
    "numpy>=2",
    "pandas>=2",
    "python-dotenv>=1",
    "streamlit>=1.39",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
