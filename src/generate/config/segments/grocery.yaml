# Grocery segment archetype (DECISIONS D11-D20 grocery references).
# Stage 3 ships the structural minimum required for D12 invariants
# and for downstream sub-stages to find their config root.
# Stage 4 sub-stages (4.1-4.8) extend this file with their specific
# knobs — intensity tiers (D14.3), missions (D17.1), daypart (D15.4),
# affinity matrix (D17.2), category price-sensitivity (D19.2), promo
# type menu (D20.1).

name: grocery

# D13.4: gravity model distance decay. Grocery shoppers stay local.
distance_decay:
  beta: 2.0

# D12 / D19.5: fixed catalog (versus ephemeral / rotating).
catalog:
  model: fixed

# D17.2: complementary-affinity matrix — [anchor_subcat, partner_subcat, boost].
# When the anchor functional_subcategory is already in a basket, the
# partner subcategory's draw probability is multiplied by the boost.
# Strong boosts (>=3.0) make T11 lift unambiguously detectable; weaker
# pairs ride mission-driven co-occurrence.
#
# datamodel-v2: subcategory names are the catalog's functional_subcategory
# values (see src/generate/config/catalog/grocery_vocab.yaml). Order is
# load-bearing for determinism: the engine walks segments in sorted name
# order then this list in order, so keep entries stable.
affinity_matrix:
  - ["Pasta", "Pasta Sauce", 5.0]
  - ["Pasta Sauce", "Pasta", 5.0]
  - ["Potato & Tortilla Chips", "Salsa & Dips", 3.5]
  - ["Salsa & Dips", "Potato & Tortilla Chips", 3.5]
  - ["Cereal", "2% Reduced-Fat Milk", 3.5]
  - ["2% Reduced-Fat Milk", "Cereal", 3.5]
  - ["Sandwich Bread", "Butter", 2.5]
  - ["Diapers & Wipes", "Formula & Baby Food", 2.5]
