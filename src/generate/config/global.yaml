# Wave 1 global config. Cross-cutting knobs read by every engine layer.
# Values trace back to docs/DECISIONS.md as noted; the loader validates
# them against the D12 invariants.

seed: 42                                 # D11 reproducibility (T18)

window:                                  # D5 window
  start_date: 2026-03-01
  end_date:   2026-05-29
  days: 90

# Per-segment transaction targets (D5). T1 in the realism battery
# (SPEC §6) gates the run against these with the tolerance below.
volume_targets:
  grocery:   1080000                     # ~1.08M
  qsr:        365000                     # ~365k
  off_price:  225000                     # ~225k
  total:     1670000
  tolerance_pct: 10                      # ±10% per D5/T1

# D14.2 population total: ~100k cards solved from per-segment
# (active cards × mean trips per active card = segment volume).
population:
  target_cards: 100000

# D13.4 gravity model constant — small offset so a same-zone store
# doesn't divide by zero.
distance_decay_d0: 0.5

# Store-count expectation. D5's "Total: 24" line is an arithmetic
# typo (15 + 9 + 5 = 29). The D13.2 placement matrix sums to 29
# and is authoritative; per-segment row totals match it.
expected_store_count: 29
