# QSR menus — real items under a shared functional taxonomy.
#
# Committed reference data (item master), authored once from each chain's
# real menu. Structure per docs/MERCHANT_PROFILES.md Part B:
#   functional_category      — SHARED 7-value taxonomy (§B4), one per item
#   functional_subcategory   — finer SHARED comparison key; genuinely shared
#                              strings where chains overlap (nuggets, fries,
#                              fountain drinks, shakes, breakfast sandwiches)
#   merchant_category/sub    — the chain's OWN menu-section labels (diverge)
#   canonical                — hidden validation key: SHARED "QSR.*" string for
#                              genuinely comparable items, banner-prefixed for
#                              banner-unique items.
# Prices are realistic ~2024 menu USD; CFA skews high > BK > TB (§B2 checks).
