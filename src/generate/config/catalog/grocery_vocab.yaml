# Grocery controlled vocabulary (datamodel-v2, curated-combinatorial).
# Source of truth for targets: docs/MERCHANT_PROFILES.md §A4/§A5/§A6/§A12.
#
# The authoring script (scripts/build_catalog.py) deterministically
# expands each subcategory into `count` canonical product concepts by
# cycling (type x size x brand), marks `pl_share` of them as private
# label (distinct SKUs), assigns a carriage role, then per banner:
#   - core / mainstream roles: carried by all three grocers
#   - premium role: ACM-heavy (affluent tail), KRG partial, WDX light
#   - value  role: WDX-heavy (deep-value tail), KRG partial, ACM light
# so per-banner assortments land at KRG ~1350 / ACM ~1250 / WDX ~1050
# (§A8) — the fullest-to-leanest ordering, not uniform.
#
# DUAL TAXONOMY (§A12): every row carries a shared `functional_*`
# triple (the normalized comparison key) AND per-banner `merchant_*`
# labels that diverge (each chain's own item master). Functional is
# shared; merchant labels differ at department/category level here.
#
# PRICING (§A7/§C7): shelf_price is baked = anchor x banner-positioning
# x PL-factor x KVI-tight/specialty-wide x per-SKU competitive index.
# No transaction-time modifiers (flat pricing).

pl_brands:
  KRG: "Kroger"
  ACM: "Signature SELECT"
  WDX: "SE Grocers"

# Real national brands drawn per category (cycled deterministically).
brand_pools:
  DAIRY:      ["Horizon", "Fairlife", "Organic Valley", "Land O'Lakes", "Chobani", "Yoplait", "Sargento", "Tillamook", "Prairie Farms"]
  BAKERY:     ["Nature's Own", "Sara Lee", "Pepperidge Farm", "Thomas'", "Wonder", "Dave's Killer Bread", "Martin's"]
  PRODUCE:    ["Dole", "Driscoll's", "Fresh Express", "Earthbound Farm", "Cuties", "Bolthouse"]
  MEAT:       ["Tyson", "Perdue", "Oscar Mayer", "Hillshire Farm", "Applegate", "Butterball", "Johnsonville"]
  FROZEN:     ["Stouffer's", "DiGiorno", "Ben & Jerry's", "Häagen-Dazs", "Birds Eye", "Totino's", "Amy's", "Talenti"]
  PANTRY:     ["Barilla", "Prego", "Progresso", "Campbell's", "Ragu", "Quaker", "Kellogg's", "Folgers", "Rao's", "Bush's"]
  SNACKS:     ["Lay's", "Doritos", "Tostitos", "Oreo", "Ritz", "Cheez-It", "Pringles", "Nabisco", "Frito-Lay", "Hershey's"]
  BEVERAGES:  ["Coca-Cola", "Pepsi", "Gatorade", "Tropicana", "Lipton", "Red Bull", "Simply", "Dasani", "Minute Maid"]
  HOUSEHOLD:  ["Tide", "Bounty", "Charmin", "Clorox", "Dawn", "Glad", "Lysol", "Ziploc"]
  PERSONAL:   ["Colgate", "Dove", "Pantene", "Old Spice", "Crest", "Gillette", "Secret"]
  BABY:       ["Pampers", "Huggies", "Gerber", "Enfamil", "Similac"]
